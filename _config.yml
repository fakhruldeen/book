# ==============================================================================
# Book Configuration (_config.yml)
# Standard Jekyll Book Theme Configuration
# Reference: https://jekyllrb.com/docs/configuration/options/
# ==============================================================================

# ---------- Book Identity & Metadata ----------
title: "كتاب Markdown التفاعلي ومختبر الطباعة العربية"
subtitle: "دليلك الشامل لبناء الكتب العربية التفاعلية واختبارات الطباعة على GitHub Pages"
description: "قالب كتاب عربي تفاعلي متكامل مبني بـ Jekyll وMarkdown مخصص لـ GitHub Pages، يتضمن اختبارات الطباعة والتنضيد، ومخططات Mermaid، والمعادلات، ونظام الاختبارات القصيرة التفاعلية."
tagline: "قالب قياسي لنشر الكتب العربية الرقمية التفاعلية على شبكة الويب"
edition: "الطبعة الأولى 1.0"
version: "1.0.0"
isbn: "978-0-2026-0001-8"
doi: "10.1000/182-arabic-book-theme"
lang: "ar"
dir: "rtl"

# Full book publication timestamp (adjustable from config and used across front/back matter)
book_timestamp: "2026-10-18T00:00:00+03:00"
book_date_formatted: "الأحد، ٦ جمادى الأولى ١٤٤٨ هـ / ١٨ أكتوبر ٢٠٢٦ م"

# ---------- Cover Art, Favicon & Social Meta (SEO) ----------
# Optional cover background image: displayed behind the <section class="cover"> card box.
# If set, it adds an atmospheric blurred backdrop. If left empty (""), it defaults to a clean procedural gradient.
cover_image: "/assets/images/cover.svg"

# Social card share image (1200x630) for Open Graph, Facebook, WhatsApp, Twitter/X cards
social_image: "/assets/images/cover.svg"

# Favicon for browser tabs and mobile bookmarks
favicon: "/assets/images/favicon.svg"

# Default SEO keywords for search engine crawlers
keywords: "كتاب عربي, Jekyll, Markdown, GitHub Pages, طباعة عربية, كتاب تفاعلي, برمجة, نشر رقمي, Arabic book, RTL"

# ---------- Author Profile ----------
author:
  name: "محمد فخر الدين"
  latin_name: "Mohamed Fakhruldeen"
  email: "fakhruldeen@gmail.com"
  bio: "مؤلف ومطور برمجيات متخصص في بناء المنصات الرقمية وهندسة النظم الموزعة ونشر المحتوى التفاعلي."
  role: "المؤلف والمهندس الرئيسي"
  avatar: "/assets/images/author.svg"
