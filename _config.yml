# ---------- Deployment Settings ----------
# User/organisation site  (user.github.io):      baseurl: ""
# Project site (user.github.io/book):            baseurl: "/book"
baseurl: "/book"
url: "https://fakhruldeen.github.io"

# ---------- Quiz Settings ----------
quiz_pass_percent: 80         # Score threshold to highlight the next button

# ---------- Jekyll Standard Environment & Build Options ----------
# Reference: https://jekyllrb.com/docs/configuration/options/
timezone: "Asia/Riyadh"
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false
strict_front_matter: false
permalink: pretty            # Clean URLs without .html (Directory / Pretty style)

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    guess_lang: true
  math_engine: mathjax
  parse_block_html: true

# ---------- Collections Configuration ----------
# Reference: https://jekyllrb.com/docs/collections/
collections:
  book:
    output: true
    permalink: /:collection/:path/

# ---------- Plugins (Official GitHub Pages Whitelist) ----------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

# ---------- Front Matter Defaults ----------
defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      published: true
      author: "محمد فخر الدين"
  - scope:
      path: "_book"
    values:
      layout: "section"
      published: true
  - scope:
      path: "frontmatter"
    values:
      layout: "frontmatter"
      published: true
  - scope:
      path: "backmatter"
    values:
      layout: "backmatter"
      published: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - tools
