<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="100%" height="auto" style="border-radius:12px;background:#0f172a;">
  <rect x="10" y="10" width="620" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Step 1 -->
  <rect x="30" y="40" width="170" height="120" rx="8" fill="#0369a1" />
  <text x="115" y="75" fill="#ffffff" font-size="24" text-anchor="middle">⚡</text>
  <text x="115" y="105" fill="#ffffff" font-size="15" font-family="'Cairo', sans-serif" font-weight="bold" text-anchor="middle">1. Use this template</text>
  <text x="115" y="130" fill="#e0f2fe" font-size="12" font-family="'Noto Naskh Arabic', sans-serif" text-anchor="middle">زر القالب على GitHub</text>
  <!-- Arrow 1 -->
  <text x="215" y="110" fill="#38bdf8" font-size="24" text-anchor="middle">→</text>
  <!-- Step 2 -->
  <rect x="235" y="40" width="170" height="120" rx="8" fill="#047857" />
  <text x="320" y="75" fill="#ffffff" font-size="24" text-anchor="middle">⚙️</text>
  <text x="320" y="105" fill="#ffffff" font-size="15" font-family="'Cairo', sans-serif" font-weight="bold" text-anchor="middle">2. عدّل _config.yml</text>
  <text x="320" y="130" fill="#d1fae5" font-size="12" font-family="'Noto Naskh Arabic', sans-serif" text-anchor="middle">بيانات كتابك ومؤلفيه</text>
  <!-- Arrow 2 -->
  <text x="420" y="110" fill="#34d399" font-size="24" text-anchor="middle">→</text>
  <!-- Step 3 -->
  <rect x="440" y="40" width="170" height="120" rx="8" fill="#7c3aed" />
  <text x="525" y="75" fill="#ffffff" font-size="24" text-anchor="middle">🚀</text>
  <text x="525" y="105" fill="#ffffff" font-size="15" font-family="'Cairo', sans-serif" font-weight="bold" text-anchor="middle">3. تفعيل GitHub Pages</text>
  <text x="525" y="130" fill="#ede9fe" font-size="12" font-family="'Noto Naskh Arabic', sans-serif" text-anchor="middle">نشر فوري دون بناء محلي</text>
